name: her_health_app
description: A women's health application.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  table_calendar: ^3.2.1
  shared_preferences: ^2.5.5
